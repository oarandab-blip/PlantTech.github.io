<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plant Tech | Administración</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='estilos.css') }}"
    />
    <style>
      .admin-page { max-width: 1150px; margin: 30px auto; padding: 0 20px; }
      .admin-card {
        background: white; border: 1px solid #d5e2d5; border-radius: 18px;
        padding: 25px; margin-bottom: 22px;
      }
      .back-link { display: inline-block; margin-bottom: 20px; color: #176b40; font-weight: bold; }
      .resumen { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
      .resumen div {
        flex: 1 1 150px; background: #edf7ee; border-radius: 12px;
        padding: 14px; text-align: center;
      }
      .resumen strong { display: block; font-size: 1.8rem; color: #195a33; }
      .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
      .tabs button {
        padding: 9px 16px; border: 1px solid #d5e2d5; border-radius: 9px;
        background: #f6faf6; cursor: pointer; font-size: 0.95rem;
      }
      .tabs button.activa { background: #237849; color: white; border-color: #237849; }
      .tabla-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
      th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #e2ebe2; vertical-align: top; }
      th { color: #194c31; background: #f6faf6; }
      .acciones { display: flex; gap: 6px; flex-wrap: wrap; }
      .acciones button {
        padding: 4px 8px; border: 1px solid #767676; border-radius: 4px;
        background: #efefef; cursor: pointer; font-size: 0.82rem;
      }
      .acciones button.peligro { border-color: #b3261e; color: #b3261e; }
      .insignia { padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; background: #e2ebe2; }
      .insignia.admin { background: #237849; color: white; }
      #aviso { min-height: 1.4em; margin: 0 0 12px; font-weight: bold; }
      #aviso.error { color: #b3261e; }
      #aviso.exito { color: #237849; }
    </style>
  </head>
  <body>
    <main class="admin-page">
      <a class="back-link" href="/">← Volver a Plant Tech</a>

      <section class="admin-card">
        <h1 style="margin-top: 0">Panel de administración 🛠️</h1>
        <p>
          Gestiona usuarios, plantas y cálculos. Las contraseñas están cifradas:
          puedes restablecerlas, pero no verlas.
        </p>
        <div class="resumen" id="resumen"></div>
      </section>

      <section class="admin-card">
        <p id="aviso" role="status"></p>
        <div class="tabs">
          <button type="button" data-tab="usuarios" class="activa">Usuarios</button>
          <button type="button" data-tab="plantas">Plantas</button>
          <button type="button" data-tab="calculos">Cálculos</button>
        </div>
        <div class="tabla-wrap" id="contenido"></div>
      </section>
    </main>

    <script>
      "use strict";

      const contenido = document.getElementById("contenido");
      const aviso = document.getElementById("aviso");
      let pestana = "usuarios";

      function el(tag, texto, atributos) {
        const nodo = document.createElement(tag);
        if (texto !== undefined && texto !== null) nodo.textContent = texto;
        Object.assign(nodo, atributos || {});
        return nodo;
      }

      function mostrarAviso(texto, tipo) {
        aviso.textContent = texto || "";
        aviso.className = tipo || "";
      }

      async function api(url, opciones) {
        const resp = await fetch(url, {
          credentials: "same-origin",
          ...(opciones || {}),
        });
        let datos = {};
        try { datos = await resp.json(); } catch (_) {}
        if (!resp.ok) throw new Error(datos.error || "Error " + resp.status);
        return datos;
      }

      function jsonPost(cuerpo) {
        return {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(cuerpo),
        };
      }

      function fecha(iso) {
        return String(iso || "").replace("T", " ").slice(0, 16);
      }

      function boton(texto, alClick, peligro) {
        const b = el("button", texto, { type: "button" });
        if (peligro) b.className = "peligro";
        b.addEventListener("click", alClick);
        return b;
      }

      function tabla(columnas, filas) {
        const t = el("table");
        const cab = el("tr");
        columnas.forEach((c) => cab.append(el("th", c)));
        t.append(cab);
        if (!filas.length) {
          const fila = el("tr");
          const td = el("td", "Sin registros.");
          td.colSpan = columnas.length;
          fila.append(td);
          t.append(fila);
        }
        filas.forEach((celdas) => {
          const fila = el("tr");
          celdas.forEach((celda) => {
            const td = el("td");
            if (celda instanceof Node) td.append(celda);
            else td.textContent = celda ?? "";
            fila.append(td);
          });
          t.append(fila);
        });
        return t;
      }

      async function cargarResumen() {
        const r = await api("/api/admin/resumen");
        const caja = document.getElementById("resumen");
        caja.replaceChildren();
        [["Usuarios", r.usuarios], ["Plantas", r.plantas], ["Cálculos", r.calculos]]
          .forEach(([nombre, valor]) => {
            const d = el("div");
            d.append(el("strong", valor), el("span", nombre));
            caja.append(d);
          });
      }

      async function accion(promesa, mensaje) {
        try {
          await promesa;
          mostrarAviso(mensaje, "exito");
          await refrescar();
        } catch (e) {
          mostrarAviso(e.message, "error");
        }
      }

      async function vistaUsuarios() {
        const datos = await api("/api/admin/usuarios");
        const filas = datos.usuarios.map((u) => {
          const esYo = u.id === datos.yo;
          const acc = el("div", null, { className: "acciones" });
          acc.append(boton("🔑 Cambiar contraseña", () => {
            const nueva = prompt("Nueva contraseña para " + u.usuario + " (mínimo 6 caracteres):");
            if (nueva === null) return;
            accion(api("/api/admin/usuarios/" + u.id + "/password",
              jsonPost({ nueva_password: nueva })), "Contraseña actualizada.");
          }));
          if (!esYo) {
            const nuevoRol = u.rol === "admin" ? "usuario" : "admin";
            acc.append(boton(
              u.rol === "admin" ? "Quitar admin" : "Hacer admin",
              () => {
                if (!confirm("¿Cambiar el rol de " + u.usuario + " a " + nuevoRol + "?")) return;
                accion(api("/api/admin/usuarios/" + u.id + "/rol",
                  jsonPost({ rol: nuevoRol })), "Rol actualizado.");
              }));
            acc.append(boton("🗑️ Eliminar", () => {
              if (!confirm("¿Eliminar a " + u.usuario + " con todas sus plantas y cálculos? No se puede deshacer.")) return;
              accion(api("/api/admin/usuarios/" + u.id, { method: "DELETE" }),
                "Usuario eliminado.");
            }, true));
          }
          const insignia = el("span", u.rol, { className: "insignia" + (u.rol === "admin" ? " admin" : "") });
          return [u.id, u.nombre, u.usuario + (esYo ? " (tú)" : ""), insignia,
                  u.n_plantas, u.n_calculos, fecha(u.creado_en), acc];
        });
        contenido.replaceChildren(tabla(
          ["ID", "Nombre", "Usuario", "Rol", "Plantas", "Cálculos", "Creado", "Acciones"], filas));
      }

      async function vistaPlantas() {
        const datos = await api("/api/admin/plantas");
        const filas = datos.plantas.map((p) => {
          const acc = el("div", null, { className: "acciones" });
          acc.append(boton("🗑️ Eliminar", () => {
            if (!confirm("¿Eliminar la planta «" + p.nombre + "» y sus cálculos?")) return;
            accion(api("/api/admin/plantas/" + p.id, { method: "DELETE" }), "Planta eliminada.");
          }, true));
          return [p.id, p.nombre, p.especie, p.propietario, p.fecha_riego,
                  p.frecuencia + " días", p.n_calculos, acc];
        });
        contenido.replaceChildren(tabla(
          ["ID", "Planta", "Especie", "Propietario", "Último riego", "Intervalo", "Cálculos", "Acciones"], filas));
      }

      function resumenCalculo(c) {
        const e = c.entradas, r = c.resultado;
        if (c.modelo === "crecimiento") {
          return "De " + e.altura_inicial + " cm a " + r.altura_estimada + " cm en " + e.dias + " días";
        }
        return "De " + e.humedad_inicial + "% a " + r.humedad_final + "% en " + e.dias + " días";
      }

      async function vistaCalculos() {
        const datos = await api("/api/admin/calculos");
        const filas = datos.calculos.map((c) => {
          const acc = el("div", null, { className: "acciones" });
          acc.append(boton("🗑️ Eliminar", () => {
            if (!confirm("¿Eliminar este cálculo?")) return;
            accion(api("/api/admin/calculos/" + c.id, { method: "DELETE" }), "Cálculo eliminado.");
          }, true));
          return [c.id, fecha(c.creado_en), c.propietario, c.planta, c.modelo, resumenCalculo(c), acc];
        });
        contenido.replaceChildren(tabla(
          ["ID", "Fecha", "Propietario", "Planta", "Modelo", "Resultado", "Acciones"], filas));
      }

      async function refrescar() {
        try {
          await cargarResumen();
          if (pestana === "usuarios") await vistaUsuarios();
          if (pestana === "plantas") await vistaPlantas();
          if (pestana === "calculos") await vistaCalculos();
        } catch (e) {
          mostrarAviso(e.message, "error");
        }
      }

      document.querySelectorAll(".tabs button").forEach((b) => {
        b.addEventListener("click", () => {
          pestana = b.dataset.tab;
          document.querySelectorAll(".tabs button").forEach((x) =>
            x.classList.toggle("activa", x === b));
          mostrarAviso("");
          refrescar();
        });
      });

      refrescar();
    </script>
  </body>
</html>
